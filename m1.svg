<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
    width="100%" height="600"
    viewBox="0 0 1100 600">
    
    <text x="100" y="30" font-size="22" fill="blue">
        Températures du 2006-1-1
    </text>
    
    <line x1="100" y1="60" x2="100" y2="500"
        stroke="blue" stroke-width="2"/>
    
    <line x1="100" y1="500" x2="1050" y2="500"
        stroke="blue" stroke-width="2"/>
    
    <text x="110" y="520" fill="blue">Casa</text>
    <rect width="25" height="308" x="115" y="192"
        stroke="blue" fill="orange">
        <animate attributeName="height" dur="3s"
            values="0;308;0" repeatCount="indefinite"/>
        <animate attributeName="y" dur="3s"
            values="500;192;500" repeatCount="indefinite"/>
    </rect>
    <text x="115" y="180">22°C</text>
    
    <text x="225" y="520" fill="blue">Rabat</text>
    <rect width="25" height="280" x="230" y="220"
        stroke="blue" fill="orange">
